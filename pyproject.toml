[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linchpin"
version = "0.2.1"
description = "Read-only CLI correlating Entra/Okta/Crowd/Bitbucket identity exports into explainable risk flags."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "cmarkgfm>=2025.10.22",
  "markdown-it-py[linkify]>=3.0",
  "ruff>=0.17.0",
  "mypy>=2.4.0",
  "bandit>=1.7",
  "pip-audit>=2.10.1",
]

[project.scripts]
linchpin = "linchpin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=linchpin --cov-branch --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/linchpin/demo.py" = ["S311"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
